<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulazione Moto Browniano - HWK 4</title>
    <link rel="stylesheet" href="settimana4.css">
</head>
<body>

<header class="navbar">
    <div class="nav-content">
        <span class="nav-logo">Homework 4</span>
        <nav>
            <a href="../home.html">Home</a>
            <a href="settimana4.html" class="active">Simulation</a>
        </nav>
    </div>
</header>

<main class="app-container">
    <div class="card">
        <h1>Application: Scaled Random Walk</h1>
        <p>Convergenza al Moto Browniano Aritmetico (Scaling $1/\sqrt{n}$)</p>

        <div class="controls">
            <div class="input-group">
                <label>Passi (n)</label>
                <input type="number" id="stepsN" value="1000" min="10" max="50000">
            </div>
            <div class="input-group">
                <label>Traiettorie (m)</label>
                <input type="number" id="pathsM" value="5" min="1" max="50">
            </div>
            <button id="runBtn">Genera Simulazione</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="brownianCanvas"></canvas>
        </div>
        
        <div class="info-footer">
            Ogni traiettoria è calcolata come $W_n(t) = \frac{1}{\sqrt{n}} \sum_{i=1}^{\lfloor nt \rfloor} X_i$, dove $X_i \in \{-1, 1\}$.
        </div>
    </div>
</main>

<script src="settimana4.js"></script>
</body>
</html>

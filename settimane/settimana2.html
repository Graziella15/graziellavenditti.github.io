<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test Statistica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calcolo Media e Varianza</h1>
        <div class="input-group">
            <input type="number" id="count" value="1000" min="1">
            <button id="btnCalcola">Genera e Calcola</button>
        </div>

        <div class="results">
            <div class="card">
                <h3>Metodo Naive</h3>
                <p>Media: <strong id="n-media">-</strong></p>
                <p>Varianza: <strong id="n-varianza">-</strong></p>
            </div>
            <div class="card">
                <h3>Metodo Online</h3>
                <p>Media: <strong id="o-media">-</strong></p>
                <p>Varianza: <strong id="o-varianza">-</strong></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

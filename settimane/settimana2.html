<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Confronto Algoritmi</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="box">
        <h1>Analisi Dati Casuali</h1>
        <input type="number" id="inputN" value="1000">
        <button id="btn">Esegui Calcolo</button>

        <div class="grid">
            <div class="card">
                <h3>Algoritmo Naive</h3>
                <span class="label">Media:</span>
                <div id="n-med" class="valore">-</div>
                <span class="label">Varianza:</span>
                <div id="n-var" class="valore">-</div>
            </div>
            <div class="card">
                <h3>Algoritmo Online</h3>
                <span class="label">Media:</span>
                <div id="o-med" class="valore">-</div>
                <span class="label">Varianza:</span>
                <div id="o-var" class="valore">-</div>
            </div>
        </div>
        <p id="msg"></p>
    </div>
    <script src="script.js"></script> </body>
</html>

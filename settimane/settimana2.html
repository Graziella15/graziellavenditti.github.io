<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test Algoritmi Statistica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Generatore Statistico</h1>
        <input type="number" id="count" value="100">
        <button id="generateBtn">Calcola</button>

        <div class="results">
            <div class="card">
                <h3>Naive</h3>
                <p>Media: <span id="naiveMean">0</span></p>
                <p>Varianza: <span id="naiveVar">0</span></p>
            </div>
            <div class="card">
                <h3>Online (Welford)</h3>
                <p>Media: <span id="onlineMean">0</span></p>
                <p>Varianza: <span id="onlineVar">0</span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confronto Algoritmi Varianza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Statistiche Online vs Naive</h1>
        <p>Genera numeri casuali e confronta i risultati dei due algoritmi.</p>
        
        <div class="controls">
            <input type="number" id="count" value="1000" placeholder="Quanti numeri?">
            <button id="generateBtn">Genera e Calcola</button>
        </div>

        <div class="results">
            <div class="card">
                <h3>Algoritmo Naive</h3>
                <p>Media: <span id="naiveMean">-</span></p>
                <p>Varianza: <span id="naiveVar">-</span></p>
            </div>
            <div class="card">
                <h3>Algoritmo Online</h3>
                <p>Media: <span id="onlineMean">-</span></p>
                <p>Varianza: <span id="onlineVar">-</span></p>
            </div>
        </div>
        
        <div id="status"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>

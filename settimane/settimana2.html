<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Statistiche: Naive vs Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Analisi Statistica in JavaScript</h1>
        <p>Confronto tra Algoritmo Naive e Algoritmo Online (Welford).</p>
        
        <div class="controls">
            <label for="sampleSize">Quantità dati:</label>
            <input type="number" id="sampleSize" value="100000" step="10000">
            <button id="runBtn">Genera e Calcola</button>
        </div>

        <div class="results">
            <table>
                <thead>
                    <tr>
                        <th>Metodo</th>
                        <th>Media ($\mu$)</th>
                        <th>Varianza ($\sigma^2$)</th>
                        <th>Tempo (ms)</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

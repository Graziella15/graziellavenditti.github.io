<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Statistico: Naive vs Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Confronto Algoritmi Statistici</h1>
        <p>Generazione di numeri casuali e calcolo della varianza in tempo reale.</p>
        
        <div class="controls">
            <button id="startBtn">Avvia Generazione</button>
            <button id="stopBtn" disabled>Ferma</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>Valore Estratto</th>
                        <th>Media (Naive)</th>
                        <th>Media (Online)</th>
                        <th>Varianza (Naive)</th>
                        <th>Varianza (Online)</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
